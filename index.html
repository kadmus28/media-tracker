<!DOCTYPE html>
<html lang="es" class="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Media Tracker</title>
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: {
                extend: {
                    colors: {
                        darkBg: '#0f172a',
                        cardBg: '#1e293b',
                        borderBg: '#334155'
                    }
                }
            }
        }
    </script>
    <!-- FontAwesome Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <!-- Supabase JS Client -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>
<body class="bg-slate-900 text-slate-100 min-h-screen font-sans flex flex-col">

    <!-- Header / Navbar -->
    <header class="border-b border-slate-800 bg-slate-950/80 backdrop-blur sticky top-0 z-40">
        <div class="max-w-7xl mx-auto px-4 py-4 flex flex-col md:flex-row md:items-center justify-between gap-4">
            <div class="flex items-center space-x-3">
                <div class="p-2 bg-indigo-600 rounded-lg">
                    <i class="fa-solid fa-layer-group text-xl text-white"></i>
                </div>
                <div>
                    <h1 class="font-bold text-xl leading-tight">Media Tracker</h1>
                    <p class="text-xs text-slate-400">Pelis, Series, Libros, Cómics, Juegos y Viajes</p>
                </div>
            </div>
            
            <button onclick="openModal()" class="bg-indigo-600 hover:bg-indigo-500 text-white font-medium px-4 py-2 rounded-lg flex items-center justify-center space-x-2 transition shadow-lg shadow-indigo-600/20">
                <i class="fa-solid fa-plus"></i>
                <span>Añadir Nuevo</span>
            </button>
        </div>
    </header>

    <!-- Main Content Area -->
    <main class="max-w-7xl mx-auto px-4 py-8 flex-1 w-full">
        
        <!-- Filters Bar -->
        <div class="flex flex-wrap items-center justify-between gap-4 mb-8 bg-slate-800/50 p-3 rounded-xl border border-slate-800">
            <!-- Category Tabs -->
            <div class="flex flex-wrap gap-1" id="categoryTabs">
                <button onclick="setCategoryFilter('all')" data-cat="all" class="cat-btn bg-indigo-600 text-white px-3 py-1.5 rounded-lg text-sm font-medium transition">Todos</button>
                <button onclick="setCategoryFilter('movie')" data-cat="movie" class="cat-btn text-slate-400 hover:text-white px-3 py-1.5 rounded-lg text-sm font-medium transition">Películas</button>
                <button onclick="setCategoryFilter('tv')" data-cat="tv" class="cat-btn text-slate-400 hover:text-white px-3 py-1.5 rounded-lg text-sm font-medium transition">Series</button>
                <button onclick="setCategoryFilter('book')" data-cat="book" class="cat-btn text-slate-400 hover:text-white px-3 py-1.5 rounded-lg text-sm font-medium transition">Libros</button>
                <button onclick="setCategoryFilter('comic')" data-cat="comic" class="cat-btn text-slate-400 hover:text-white px-3 py-1.5 rounded-lg text-sm font-medium transition">Cómics</button>
                <button onclick="setCategoryFilter('game')" data-cat="game" class="cat-btn text-slate-400 hover:text-white px-3 py-1.5 rounded-lg text-sm font-medium transition">Juegos</button>
                <button onclick="setCategoryFilter('travel')" data-cat="travel" class="cat-btn text-slate-400 hover:text-white px-3 py-1.5 rounded-lg text-sm font-medium transition">Viajes</button>
            </div>

            <!-- Status Filter -->
            <div class="flex items-center space-x-2">
                <label for="statusSelect" class="text-xs text-slate-400 font-medium uppercase tracking-wider">Estado:</label>
                <select id="statusSelect" onchange="renderItems()" class="bg-slate-900 border border-slate-700 text-slate-200 text-sm rounded-lg px-3 py-1.5 focus:outline-none focus:border-indigo-500">
                    <option value="all">Todos los estados</option>
                    <option value="completed">Completados</option>
                    <option value="in_progress">En curso</option>
                    <option value="planned">Pendientes</option>
                </select>
            </div>
        </div>

        <!-- Media Grid -->
        <div id="mediaGrid" class="grid grid-cols-2 sm:grid-cols-3 md:grid-cols-4 lg:grid-cols-5 xl:grid-cols-6 gap-6">
            <!-- Dynamic Content Loaded Here -->
        </div>

        <!-- Empty State -->
        <div id="emptyState" class="hidden text-center py-16">
            <i class="fa-solid fa-compact-disc text-5xl text-slate-600 mb-4"></i>
            <h3 class="text-lg font-medium text-slate-300">No hay elementos registrados</h3>
            <p class="text-sm text-slate-500 mt-1">Haz clic en "Añadir Nuevo" para comenzar a organizar tus contenidos.</p>
        </div>
    </main>

    <!-- Modal for Adding / Editing Items -->
    <div id="itemModal" class="fixed inset-0 bg-black/70 backdrop-blur-sm z-50 flex items-center justify-center p-4 hidden">
        <div class="bg-slate-800 rounded-2xl max-w-lg w-full p-6 border border-slate-700 shadow-2xl relative max-h-[90vh] overflow-y-auto">
            
            <button onclick="closeModal()" class="absolute top-4 right-4 text-slate-400 hover:text-white">
                <i class="fa-solid fa-xmark text-xl"></i>
            </button>

            <h2 class="text-xl font-bold mb-4" id="modalTitle">Añadir Nuevo Elemento</h2>

            <form id="mediaForm" onsubmit="saveItem(event)">
                <!-- Category Picker -->
                <div class="mb-4">
                    <label class="block text-xs font-semibold text-slate-400 uppercase tracking-wider mb-2">Categoría</label>
                    <select id="formCategory" onchange="handleCategoryChange()" class="w-full bg-slate-900 border border-slate-700 rounded-lg px-3 py-2 text-white focus:outline-none focus:border-indigo-500">
                        <option value="movie">Película</option>
                        <option value="tv">Serie</option>
                        <option value="book">Libro</option>
                        <option value="comic">Cómic</option>
                        <option value="game">Videojuego</option>
                        <option value="travel">Viaje</option>
                    </select>
                </div>

                <!-- Title & Search Button -->
                <div class="mb-4">
                    <label class="block text-xs font-semibold text-slate-400 uppercase tracking-wider mb-2">Título</label>
                    <div class="flex gap-2">
                        <input type="text" id="formTitle" required placeholder="Ej: Batman, Dune, Inception..." class="flex-1 bg-slate-900 border border-slate-700 rounded-lg px-3 py-2 text-white focus:outline-none focus:border-indigo-500">
                        <button type="button" id="searchBtn" onclick="autoSearchCover()" class="bg-indigo-600 hover:bg-indigo-500 px-3 py-2 rounded-lg text-sm text-white font-medium transition flex items-center gap-1.5">
                            <i class="fa-solid fa-magnifying-glass"></i>
                            <span>Buscar</span>
                        </button>
                    </div>
                </div>

                <!-- Results List for Selection -->
                <div id="searchResults" class="hidden mb-4 bg-slate-900 rounded-lg p-2 border border-slate-700 max-h-48 overflow-y-auto space-y-2">
                    <!-- Dynamic list of search matches -->
                </div>

                <!-- Subtitle / Author / Director -->
                <div class="mb-4">
                    <label class="block text-xs font-semibold text-slate-400 uppercase tracking-wider mb-2" id="subtitleLabel">Director / Creador</label>
                    <input type="text" id="formSubtitle" placeholder="Ej: Christopher Nolan, Frank Herbert..." class="w-full bg-slate-900 border border-slate-700 rounded-lg px-3 py-2 text-white focus:outline-none focus:border-indigo-500">
                </div>

                <!-- Cover URL -->
                <div class="mb-4">
                    <label class="block text-xs font-semibold text-slate-400 uppercase tracking-wider mb-2">URL de la Portada / Imagen</label>
                    <input type="url" id="formCover" required placeholder="https://..." class="w-full bg-slate-900 border border-slate-700 rounded-lg px-3 py-2 text-white focus:outline-none focus:border-indigo-500">
                </div>

                <!-- Status & Rating Grid -->
                <div class="grid grid-cols-2 gap-4 mb-4">
                    <div>
                        <label class="block text-xs font-semibold text-slate-400 uppercase tracking-wider mb-2">Estado</label>
                        <select id="formStatus" class="w-full bg-slate-900 border border-slate-700 rounded-lg px-3 py-2 text-white focus:outline-none focus:border-indigo-500">
                            <option value="planned">Pendiente</option>
                            <option value="in_progress">En curso</option>
                            <option value="completed">Completado</option>
                        </select>
                    </div>
                    <div>
                        <label class="block text-xs font-semibold text-slate-400 uppercase tracking-wider mb-2">Puntuación (0 - 5)</label>
                        <input type="number" id="formRating" min="0" max="5" step="0.5" value="0" class="w-full bg-slate-900 border border-slate-700 rounded-lg px-3 py-2 text-white focus:outline-none focus:border-indigo-500">
                    </div>
                </div>

                <!-- Progress Trackers -->
                <div class="grid grid-cols-2 gap-4 mb-4" id="progressContainer">
                    <div>
                        <label class="block text-xs font-semibold text-slate-400 uppercase tracking-wider mb-2" id="currentProgLabel">Progreso Actual</label>
                        <input type="number" id="formCurrentProg" value="0" min="0" class="w-full bg-slate-900 border border-slate-700 rounded-lg px-3 py-2 text-white focus:outline-none focus:border-indigo-500">
                    </div>
                    <div>
                        <label class="block text-xs font-semibold text-slate-400 uppercase tracking-wider mb-2" id="totalProgLabel">Total</label>
                        <input type="number" id="formTotalProg" value="0" min="0" class="w-full bg-slate-900 border border-slate-700 rounded-lg px-3 py-2 text-white focus:outline-none focus:border-indigo-500">
                    </div>
                </div>

                <!-- Review / Notes -->
                <div class="mb-6">
                    <label class="block text-xs font-semibold text-slate-400 uppercase tracking-wider mb-2">Notas / Reseña</label>
                    <textarea id="formReview" rows="3" placeholder="Tus impresiones o notas..." class="w-full bg-slate-900 border border-slate-700 rounded-lg px-3 py-2 text-white focus:outline-none focus:border-indigo-500"></textarea>
                </div>

                <div class="flex justify-end gap-3">
                    <button type="button" onclick="closeModal()" class="px-4 py-2 bg-slate-700 hover:bg-slate-600 rounded-lg text-sm text-slate-300">Cancelar</button>
                    <button type="submit" class="px-4 py-2 bg-indigo-600 hover:bg-indigo-500 rounded-lg text-sm font-medium text-white">Guardar</button>
                </div>
            </form>
        </div>
    </div>

    <!-- Application JavaScript Logic -->
    <script>
        // Configuración de Supabase (URL base limpia sin /rest/v1/)
        const SUPABASE_URL = 'https://akyewbyhbgcvlcblkerb.supabase.co';
        const SUPABASE_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImFreWV3YnloYmdjdmxjYmxrZXJiIiwicm9sZSI6ImFub24iLCJpYXQiOjE3OTAyMzczNTYsImV4cCI6MjEwNTgxMzM1Nn0.J3eunUN-qE99cgocSSNO93oNH9nZbSP-C-dJYSyPdlA';

        // TMDB API Key v3
        const TMDB_API_KEY = '592f0a9b86580dc2aae33e086a9116cb';

        const supabaseClient = supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

        let items = [];
        let currentCategoryFilter = 'all';

        // Carga inicial
        document.addEventListener('DOMContentLoaded', () => {
            fetchItems();
        });

        // Obtener elementos desde Supabase
        async function fetchItems() {
            try {
                const { data, error } = await supabaseClient
                    .from('media_items')
                    .select('*')
                    .order('created_at', { ascending: false });

                if (error) throw error;
                items = data || [];
                renderItems();
            } catch (err) {
                console.error('Error al cargar datos:', err.message);
            }
        }

        // Renderizar la cuadrícula de elementos
        function renderItems() {
            const grid = document.getElementById('mediaGrid');
            const emptyState = document.getElementById('emptyState');
            const statusFilter = document.getElementById('statusSelect').value;

            grid.innerHTML = '';

            const filtered = items.filter(item => {
                const catMatch = currentCategoryFilter === 'all' || item.category === currentCategoryFilter;
                const statusMatch = statusFilter === 'all' || item.status === statusFilter;
                return catMatch && statusMatch;
            });

            if (filtered.length === 0) {
                emptyState.classList.remove('hidden');
            } else {
                emptyState.classList.add('hidden');
                filtered.forEach(item => {
                    grid.appendChild(createMediaCard(item));
                });
            }
        }

        // Crear la tarjeta visual del elemento
        function createMediaCard(item) {
            const card = document.createElement('div');
            card.className = 'group bg-slate-800 rounded-xl overflow-hidden border border-slate-700/60 hover:border-indigo-500/50 transition-all duration-300 flex flex-col shadow-lg hover:-translate-y-1';

            const badgeColor = {
                completed: 'bg-emerald-500/20 text-emerald-400 border-emerald-500/30',
                in_progress: 'bg-amber-500/20 text-amber-400 border-amber-500/30',
                planned: 'bg-slate-500/20 text-slate-400 border-slate-500/30'
            }[item.status] || 'bg-slate-500/20 text-slate-400';

            const statusText = {
                completed: 'Completado',
                in_progress: 'En curso',
                planned: 'Pendiente'
            }[item.status] || item.status;

            card.innerHTML = `
                <div class="relative aspect-[2/3] overflow-hidden bg-slate-900">
                    <img src="${item.cover_url}" alt="${item.title}" class="w-full h-full object-cover group-hover:scale-105 transition-transform duration-300" onerror="this.src='https://via.placeholder.com/300x450/1e293b/94a3b8?text=Sin+Imagen'">
                    <div class="absolute top-2 right-2">
                        <span class="text-[10px] uppercase font-bold px-2 py-0.5 rounded-full border backdrop-blur-md ${badgeColor}">
                            ${statusText}
                        </span>
                    </div>
                    ${item.rating > 0 ? `
                        <div class="absolute bottom-2 left-2 bg-black/70 backdrop-blur-md px-2 py-0.5 rounded-md text-amber-400 text-xs font-bold flex items-center gap-1">
                            <i class="fa-solid fa-star"></i>
                            <span>${item.rating}</span>
                        </div>
                    ` : ''}
                </div>
                <div class="p-3 flex-1 flex flex-col justify-between">
                    <div>
                        <h4 class="font-bold text-sm text-slate-100 line-clamp-1">${item.title}</h4>
                        ${item.subtitle ? `<p class="text-xs text-slate-400 line-clamp-1 mt-0.5">${item.subtitle}</p>` : ''}
                    </div>
                    <div class="mt-3 pt-2 border-t border-slate-700/50 flex items-center justify-between text-xs text-slate-400">
                        <span class="capitalize">${getCategoryName(item.category)}</span>
                        <button onclick="deleteItem('${item.id}')" class="hover:text-red-400 transition">
                            <i class="fa-solid fa-trash-can"></i>
                        </button>
                    </div>
                </div>
            `;
            return card;
        }

        function getCategoryName(cat) {
            const map = { movie: 'Película', tv: 'Serie', book: 'Libro', comic: 'Cómic', game: 'Juego', travel: 'Viaje' };
            return map[cat] || cat;
        }

        function setCategoryFilter(cat) {
            currentCategoryFilter = cat;
            document.querySelectorAll('.cat-btn').forEach(btn => {
                if (btn.dataset.cat === cat) {
                    btn.className = 'cat-btn bg-indigo-600 text-white px-3 py-1.5 rounded-lg text-sm font-medium transition';
                } else {
                    btn.className = 'cat-btn text-slate-400 hover:text-white px-3 py-1.5 rounded-lg text-sm font-medium transition';
                }
            });
            renderItems();
        }

        // Gestión del Modal
        function openModal() {
            document.getElementById('mediaForm').reset();
            document.getElementById('searchResults').classList.add('hidden');
            document.getElementById('searchResults').innerHTML = '';
            handleCategoryChange();
            document.getElementById('itemModal').classList.remove('hidden');
        }

        function closeModal() {
            document.getElementById('itemModal').classList.add('hidden');
        }

        function handleCategoryChange() {
            const cat = document.getElementById('formCategory').value;
            const subLabel = document.getElementById('subtitleLabel');
            if (cat === 'movie' || cat === 'tv') subLabel.textContent = 'Año / Director';
            else if (cat === 'book' || cat === 'comic') subLabel.textContent = 'Autor / Ilustrador';
            else if (cat === 'game') subLabel.textContent = 'Desarrollador / Plataforma';
            else if (cat === 'travel') subLabel.textContent = 'País / Ciudad';
        }

        // Guardar elemento en Supabase
        async function saveItem(e) {
            e.preventDefault();
            const newItem = {
                category: document.getElementById('formCategory').value,
                title: document.getElementById('formTitle').value,
                subtitle: document.getElementById('formSubtitle').value,
                cover_url: document.getElementById('formCover').value,
                status: document.getElementById('formStatus').value,
                rating: parseFloat(document.getElementById('formRating').value) || 0,
                current_progress: parseInt(document.getElementById('formCurrentProg').value) || 0,
                total_progress: parseInt(document.getElementById('formTotalProg').value) || 0,
                review: document.getElementById('formReview').value
            };

            try {
                const { data, error } = await supabaseClient
                    .from('media_items')
                    .insert([newItem])
                    .select();

                if (error) throw error;
                closeModal();
                fetchItems();
            } catch (err) {
                alert('Error al guardar: ' + err.message);
            }
        }

        // Eliminar elemento de Supabase
        async function deleteItem(id) {
            if (!confirm('¿Seguro que quieres eliminar este elemento?')) return;
            try {
                const { error } = await supabaseClient
                    .from('media_items')
                    .delete()
                    .eq('id', id);

                if (error) throw error;
                fetchItems();
            } catch (err) {
                alert('Error al eliminar: ' + err.message);
            }
        }

        // Búsqueda automática de portadas (TMDB / Google Books)
        async function autoSearchCover() {
            const title = document.getElementById('formTitle').value.trim();
            const cat = document.getElementById('formCategory').value;
            const searchBtn = document.getElementById('searchBtn');
            const resultsDiv = document.getElementById('searchResults');

            if (!title) return alert('Escribe primero el título a buscar');

            searchBtn.innerHTML = '<i class="fa-solid fa-spinner fa-spin"></i> Buscando...';
            resultsDiv.innerHTML = '';
            resultsDiv.classList.add('hidden');

            try {
                if (cat === 'movie' || cat === 'tv') {
                    const type = cat === 'movie' ? 'movie' : 'tv';
                    const url = `https://api.themoviedb.org/3/search/${type}?api_key=${TMDB_API_KEY}&query=${encodeURIComponent(title)}&language=es-ES`;
                    
                    const res = await fetch(url);
                    const data = await res.json();
                    
                    if (data.results && data.results.length > 0) {
                        resultsDiv.classList.remove('hidden');
                        data.results.slice(0, 5).forEach(item => {
                            const name = item.title || item.name;
                            const releaseDate = item.release_date || item.first_air_date || '';
                            const year = releaseDate ? releaseDate.split('-')[0] : 'N/A';
                            const poster = item.poster_path ? `https://image.tmdb.org/t/p/w92${item.poster_path}` : 'https://via.placeholder.com/92x138?text=No+Img';
                            const fullPoster = item.poster_path ? `https://image.tmdb.org/t/p/w500${item.poster_path}` : '';

                            const row = document.createElement('div');
                            row.className = 'flex items-center gap-3 p-2 hover:bg-slate-800 rounded-lg cursor-pointer transition';
                            row.onclick = () => selectResult(name, `Año: ${year}`, fullPoster);
                            
                            row.innerHTML = `
                                <img src="${poster}" class="w-10 h-14 object-cover rounded">
                                <div class="overflow-hidden">
                                    <p class="text-sm font-semibold text-slate-200 truncate">${name}</p>
                                    <p class="text-xs text-slate-400">${year}</p>
                                </div>
                            `;
                            resultsDiv.appendChild(row);
                        });
                    } else {
                        alert('No se encontraron coincidencias.');
                    }
                } else if (cat === 'book' || cat === 'comic') {
                    const res = await fetch(`https://www.googleapis.com/books/v1/volumes?q=${encodeURIComponent(title)}`);
                    const data = await res.json();
                    if (data.items && data.items.length > 0) {
                        resultsDiv.classList.remove('hidden');
                        data.items.slice(0, 5).forEach(item => {
                            const book = item.volumeInfo;
                            const bTitle = book.title;
                            const authors = book.authors ? book.authors.join(', ') : '';
                            const thumb = book.imageLinks?.thumbnail ? book.imageLinks.thumbnail.replace('http:', 'https:') : '';

                            const row = document.createElement('div');
                            row.className = 'flex items-center gap-3 p-2 hover:bg-slate-800 rounded-lg cursor-pointer transition';
                            row.onclick = () => selectResult(bTitle, authors, thumb);
                            
                            row.innerHTML = `
                                <img src="${thumb || 'https://via.placeholder.com/92x138?text=No+Img'}" class="w-10 h-14 object-cover rounded">
                                <div class="overflow-hidden">
                                    <p class="text-sm font-semibold text-slate-200 truncate">${bTitle}</p>
                                    <p class="text-xs text-slate-400 truncate">${authors}</p>
                                </div>
                            `;
                            resultsDiv.appendChild(row);
                        });
                    } else {
                        alert('No se encontraron coincidencias.');
                    }
                }
            } catch (e) {
                console.error('Error buscando información:', e);
                alert('Ocurrió un error en la búsqueda.');
            } finally {
                searchBtn.innerHTML = '<i class="fa-solid fa-magnifying-glass"></i> <span>Buscar</span>';
            }
        }

        function selectResult(title, subtitle, coverUrl) {
            document.getElementById('formTitle').value = title;
            document.getElementById('formSubtitle').value = subtitle;
            if (coverUrl) document.getElementById('formCover').value = coverUrl;
            document.getElementById('searchResults').classList.add('hidden');
        }
    </script>
</body>
</html>
