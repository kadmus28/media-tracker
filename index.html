<!DOCTYPE html>
<html lang="es" class="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Media Tracker - Delicious Library Style</title>
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- FontAwesome Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <!-- Supabase JS Client -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <style>
        /* Estilo clásico de madera hiperrealista tipo Delicious Library */
        .delicious-wall {
            background-color: #3b2314;
            background-image: 
                linear-gradient(90deg, rgba(0,0,0,0.3) 0%, transparent 3%, transparent 97%, rgba(0,0,0,0.3) 100%),
                repeating-linear-gradient(0deg, #4d2e1a, #4d2e1a 120px, #3b2314 120px, #3b2314 240px);
            background-size: 100% 100%, 100% 240px;
        }

        /* Estantería de madera maciza con bisel y sombra profunda */
        .delicious-shelf {
            background: linear-gradient(to bottom, #d4a373 0%, #faedcd 8%, #ccd5ae 12%, #a3703f 25%, #6d4520 80%, #422810 100%);
            box-shadow: 0 15px 25px rgba(0, 0, 0, 0.7), inset 0 2px 4px rgba(255, 255, 255, 0.5);
            border-bottom: 6px solid #28160a;
            border-top: 1px solid rgba(255, 255, 255, 0.3);
        }

        /* Sombra inclinada realista para las cajas de las películas */
        .case-3d-shadow {
            box-shadow: 8px 12px 18px rgba(0, 0, 0, 0.8), -2px 0 5px rgba(255, 255, 255, 0.2);
            transition: transform 0.2s ease, box-shadow 0.2s ease;
        }
        .case-3d-shadow:hover {
            transform: translateY(-6px) scale(1.02);
            box-shadow: 12px 18px 25px rgba(0, 0, 0, 0.9), -2px 0 8px rgba(255, 255, 255, 0.3);
        }
    </style>
</head>
<body class="delicious-wall text-amber-50 min-h-screen font-sans flex flex-col">

    <!-- Header / Navbar -->
    <header class="border-b border-amber-950/80 bg-stone-950/90 text-amber-50 backdrop-blur sticky top-0 z-40 shadow-xl">
        <div class="max-w-7xl mx-auto px-4 py-4 flex flex-col md:flex-row md:items-center justify-between gap-4">
            <div class="flex items-center space-x-3">
                <div class="p-2 bg-amber-700 rounded-lg text-white shadow-md border border-amber-500/30">
                    <i class="fa-solid fa-book-bookmark text-xl"></i>
                </div>
                <div>
                    <h1 class="font-bold text-xl leading-tight text-amber-100">Media Tracker</h1>
                    <p class="text-xs text-amber-300/80">Estantería Virtual Delicious Library</p>
                </div>
            </div>
            
            <div class="flex items-center gap-3">
                <button onclick="document.getElementById('csvFileInput').click()" class="bg-stone-800 hover:bg-stone-700 text-amber-200 font-medium px-3.5 py-2 rounded-lg flex items-center space-x-2 transition border border-amber-800/50 text-sm shadow">
                    <i class="fa-solid fa-file-csv text-emerald-400"></i>
                    <span>Importar Letterboxd</span>
                </button>
                <input type="file" id="csvFileInput" accept=".csv" class="hidden" onchange="importLetterboxdCSV(event)">

                <button onclick="openModal()" class="bg-amber-700 hover:bg-amber-600 text-white font-medium px-4 py-2 rounded-lg flex items-center justify-center space-x-2 transition shadow-lg text-sm border border-amber-500/40">
                    <i class="fa-solid fa-plus"></i>
                    <span>Añadir Elemento</span>
                </button>
            </div>
        </div>
    </header>

    <!-- Modal de Progreso de Importación -->
    <div id="importProgressModal" class="fixed inset-0 bg-black/80 backdrop-blur-md z-50 flex items-center justify-center p-4 hidden">
        <div class="bg-stone-900 text-stone-100 rounded-2xl max-w-md w-full p-6 border border-amber-800/50 shadow-2xl text-center">
            <i class="fa-solid fa-wand-magic-sparkles text-4xl text-amber-400 animate-bounce mb-3"></i>
            <h3 class="text-lg font-bold text-white mb-1">Importando de Letterboxd</h3>
            <p class="text-xs text-stone-400 mb-4">Descargando portadas, sinopsis e información de TMDB...</p>
            <div class="w-full bg-stone-950 rounded-full h-3 mb-2 overflow-hidden border border-stone-800">
                <div id="importProgressBar" class="bg-amber-500 h-full w-0 transition-all duration-200"></div>
            </div>
            <p id="importProgressStatus" class="text-xs text-amber-300 font-medium">Procesando 0 / 0</p>
        </div>
    </div>

    <!-- Main Content Area: Estantería Delicious Library -->
    <main class="max-w-7xl mx-auto px-4 py-8 flex-1 w-full">
        
        <!-- Barra de Filtros -->
        <div class="flex flex-wrap items-center justify-between gap-4 mb-8 bg-amber-950/90 p-3 rounded-xl border border-amber-800/60 text-amber-100 backdrop-blur shadow-2xl">
            <div class="flex flex-wrap gap-1" id="categoryTabs">
                <button onclick="setCategoryFilter('all')" data-cat="all" class="cat-btn bg-amber-700 text-white px-3 py-1.5 rounded-lg text-sm font-medium transition">Todos</button>
                <button onclick="setCategoryFilter('movie')" data-cat="movie" class="cat-btn text-amber-200/80 hover:text-white px-3 py-1.5 rounded-lg text-sm font-medium transition">Películas</button>
                <button onclick="setCategoryFilter('tv')" data-cat="tv" class="cat-btn text-amber-200/80 hover:text-white px-3 py-1.5 rounded-lg text-sm font-medium transition">Series</button>
                <button onclick="setCategoryFilter('book')" data-cat="book" class="cat-btn text-amber-200/80 hover:text-white px-3 py-1.5 rounded-lg text-sm font-medium transition">Libros</button>
                <button onclick="setCategoryFilter('comic')" data-cat="comic" class="cat-btn text-amber-200/80 hover:text-white px-3 py-1.5 rounded-lg text-sm font-medium transition">Cómics</button>
                <button onclick="setCategoryFilter('game')" data-cat="game" class="cat-btn text-amber-200/80 hover:text-white px-3 py-1.5 rounded-lg text-sm font-medium transition">Juegos</button>
                <button onclick="setCategoryFilter('travel')" data-cat="travel" class="cat-btn text-amber-200/80 hover:text-white px-3 py-1.5 rounded-lg text-sm font-medium transition">Viajes</button>
                
                <span class="border-r border-amber-800/60 my-1 mx-1"></span>

                <button onclick="setCategoryFilter('library')" data-cat="library" class="cat-btn text-indigo-300 hover:text-indigo-200 px-3 py-1.5 rounded-lg text-sm font-medium transition flex items-center gap-1.5">
                    <i class="fa-solid fa-house"></i> Mi Biblioteca
                </button>
                <button onclick="setCategoryFilter('pending_watch')" data-cat="pending_watch" class="cat-btn text-amber-400 hover:text-amber-300 px-3 py-1.5 rounded-lg text-sm font-medium transition flex items-center gap-1.5">
                    <i class="fa-solid fa-clock"></i> Pendiente de ver
                </button>
                <button onclick="setCategoryFilter('shopping_list')" data-cat="shopping_list" class="cat-btn text-emerald-400 hover:text-emerald-300 px-3 py-1.5 rounded-lg text-sm font-medium transition flex items-center gap-1.5">
                    <i class="fa-solid fa-cart-shopping"></i> Comprar (Físico)
                </button>
            </div>

            <div class="flex items-center space-x-2">
                <label for="statusSelect" class="text-xs text-amber-200/80 font-medium uppercase tracking-wider">Estado:</label>
                <select id="statusSelect" onchange="renderItems()" class="bg-stone-900 border border-amber-800/60 text-amber-100 text-sm rounded-lg px-3 py-1.5 focus:outline-none focus:border-amber-500">
                    <option value="all">Todos los estados</option>
                    <option value="completed">Completados</option>
                    <option value="in_progress">En curso</option>
                    <option value="planned">Pendientes</option>
                </select>
            </div>
        </div>

        <!-- Contenedor de Estantes -->
        <div id="bookshelfContainer" class="flex flex-col gap-14">
            <!-- Baldas e ítems cargados aquí -->
        </div>

        <!-- Estado Vacío -->
        <div id="emptyState" class="hidden text-center py-20 bg-amber-950/80 text-amber-100 rounded-2xl border border-amber-800/50">
            <i class="fa-solid fa-boxes-packing text-5xl text-amber-600/60 mb-4"></i>
            <h3 class="text-lg font-medium text-amber-200">No hay elementos en este estante</h3>
            <p class="text-sm text-amber-300/60 mt-1">Añade nuevos contenidos o ajusta los filtros superiores.</p>
        </div>
    </main>

    <!-- Modal de Detalle / Ficha Completa -->
    <div id="detailModal" class="fixed inset-0 bg-black/80 backdrop-blur-md z-50 flex items-center justify-center p-4 hidden">
        <div class="bg-stone-900 text-stone-100 rounded-2xl max-w-2xl w-full p-6 border border-amber-800/60 shadow-2xl relative max-h-[90vh] overflow-y-auto">
            <button onclick="closeDetailModal()" class="absolute top-4 right-4 text-stone-400 hover:text-white">
                <i class="fa-solid fa-xmark text-2xl"></i>
            </button>

            <div class="flex flex-col md:flex-row gap-6" id="detailModalContent">
                <!-- Inyectado dinámicamente -->
            </div>
        </div>
    </div>

    <!-- Modal Formulario Añadir / Editar -->
    <div id="itemModal" class="fixed inset-0 bg-black/70 backdrop-blur-sm z-50 flex items-center justify-center p-4 hidden">
        <div class="bg-stone-900 text-stone-100 rounded-2xl max-w-lg w-full p-6 border border-amber-800/60 shadow-2xl relative max-h-[90vh] overflow-y-auto">
            <button onclick="closeModal()" class="absolute top-4 right-4 text-stone-400 hover:text-white">
                <i class="fa-solid fa-xmark text-xl"></i>
            </button>

            <h2 class="text-xl font-bold mb-4 text-amber-100" id="modalTitle">Añadir Nuevo Elemento</h2>

            <form id="mediaForm" onsubmit="saveItem(event)">
                <input type="hidden" id="editingItemId" value="">
                <input type="hidden" id="formPlatformLogo" value="">

                <div class="mb-4">
                    <label class="block text-xs font-semibold text-amber-300/80 uppercase tracking-wider mb-2">Categoría</label>
                    <select id="formCategory" onchange="handleCategoryChange()" class="w-full bg-stone-950 border border-amber-900/50 rounded-lg px-3 py-2 text-white focus:outline-none focus:border-amber-600">
                        <option value="movie">Película</option>
                        <option value="tv">Serie</option>
                        <option value="book">Libro</option>
                        <option value="comic">Cómic</option>
                        <option value="game">Videojuego</option>
                        <option value="travel">Viaje</option>
                    </select>
                </div>

                <div class="mb-4">
                    <label class="block text-xs font-semibold text-amber-300/80 uppercase tracking-wider mb-2">Título</label>
                    <div class="flex gap-2">
                        <input type="text" id="formTitle" required placeholder="Ej: Batman, Dune, Inception..." class="flex-1 bg-stone-950 border border-amber-900/50 rounded-lg px-3 py-2 text-white focus:outline-none focus:border-amber-600">
                        <button type="button" id="searchBtn" onclick="autoSearchCover()" class="bg-amber-700 hover:bg-amber-600 px-3 py-2 rounded-lg text-sm text-white font-medium transition flex items-center gap-1.5">
                            <i class="fa-solid fa-magnifying-glass"></i>
                            <span>Buscar</span>
                        </button>
                    </div>
                </div>

                <div id="searchResults" class="hidden mb-4 bg-stone-950 rounded-lg p-2 border border-amber-900/40 max-h-48 overflow-y-auto space-y-2"></div>

                <div class="mb-4">
                    <label class="block text-xs font-semibold text-amber-300/80 uppercase tracking-wider mb-2" id="subtitleLabel">Director / Reparto / Año</label>
                    <input type="text" id="formSubtitle" placeholder="Ej: Christopher Nolan | Reparto: Leonardo DiCaprio..." class="w-full bg-stone-950 border border-amber-900/50 rounded-lg px-3 py-2 text-white focus:outline-none focus:border-amber-600">
                </div>

                <div class="mb-4" id="platformContainer">
                    <label class="block text-xs font-semibold text-amber-300/80 uppercase tracking-wider mb-2">Plataforma / Dónde ver</label>
                    <input type="text" id="formPlatform" placeholder="Ej: Netflix, Prime Video, HBO Max, Disney+, Movistar+..." class="w-full bg-stone-950 border border-amber-900/50 rounded-lg px-3 py-2 text-white focus:outline-none focus:border-amber-600">
                </div>

                <div class="mb-4">
                    <label class="block text-xs font-semibold text-amber-300/80 uppercase tracking-wider mb-2">URL de la Portada / Imagen</label>
                    <input type="url" id="formCover" required placeholder="https://..." class="w-full bg-stone-950 border border-amber-900/50 rounded-lg px-3 py-2 text-white focus:outline-none focus:border-amber-600">
                </div>

                <div class="grid grid-cols-2 gap-4 mb-4">
                    <div>
                        <label class="block text-xs font-semibold text-amber-300/80 uppercase tracking-wider mb-2">Estado</label>
                        <select id="formStatus" class="w-full bg-stone-950 border border-amber-900/50 rounded-lg px-3 py-2 text-white focus:outline-none focus:border-amber-600">
                            <option value="planned">Pendiente</option>
                            <option value="in_progress">En curso</option>
                            <option value="completed">Completado</option>
                        </select>
                    </div>
                    <div>
                        <label class="block text-xs font-semibold text-amber-300/80 uppercase tracking-wider mb-2">Puntuación (0 - 10)</label>
                        <input type="number" id="formRating" min="0" max="10" step="0.5" value="0" class="w-full bg-stone-950 border border-amber-900/50 rounded-lg px-3 py-2 text-white focus:outline-none focus:border-amber-600">
                    </div>
                </div>

                <!-- Propiedad Físicas y Formato -->
                <div class="space-y-3 mb-4">
                    <div class="p-3 bg-stone-950/60 rounded-lg border border-amber-900/30">
                        <div class="flex items-center gap-3">
                            <input type="checkbox" id="formInLibrary" onchange="toggleFormatSelector()" class="w-4 h-4 text-amber-600 bg-stone-900 border-amber-800 rounded focus:ring-amber-500">
                            <label for="formInLibrary" class="text-xs font-medium text-amber-200 cursor-pointer flex items-center gap-1.5">
                                <i class="fa-solid fa-house text-amber-400"></i>
                                Añadir a Mi Biblioteca (Propiedad física)
                            </label>
                        </div>

                        <div id="formatContainer" class="hidden mt-3 pt-2 border-t border-amber-900/30">
                            <label class="block text-xs font-semibold text-amber-300/80 uppercase tracking-wider mb-1">Formato Físico:</label>
                            <select id="formFormat" class="w-full bg-stone-900 border border-amber-900/50 rounded-lg px-3 py-1.5 text-xs text-amber-100 focus:outline-none focus:border-amber-600">
                                <option value="4K UHD Blu-ray">4K UHD Blu-ray</option>
                                <option value="Blu-ray">Blu-ray</option>
                                <option value="DVD">DVD</option>
                                <option value="Steelbook">Steelbook / Ed. Especial</option>
                                <option value="VHS">VHS</option>
                                <option value="Laserdisc">Laserdisc</option>
                                <option value="Digital">Digital / Copia de seguridad</option>
                            </select>
                        </div>
                    </div>

                    <div class="p-3 bg-stone-950/60 rounded-lg border border-amber-900/30 flex items-center gap-3">
                        <input type="checkbox" id="formToBuy" class="w-4 h-4 text-emerald-600 bg-stone-900 border-amber-800 rounded focus:ring-emerald-500">
                        <label for="formToBuy" class="text-xs font-medium text-amber-200 cursor-pointer flex items-center gap-1.5">
                            <i class="fa-solid fa-cart-shopping text-emerald-400"></i>
                            Añadir a Lista de la Compra (Deseo comprarlo)
                        </label>
                    </div>
                </div>

                <div class="mb-6">
                    <label class="block text-xs font-semibold text-amber-300/80 uppercase tracking-wider mb-2">Sinopsis / Trama</label>
                    <textarea id="formReview" rows="4" placeholder="Sinopsis, trama o notas..." class="w-full bg-stone-950 border border-amber-900/50 rounded-lg px-3 py-2 text-white focus:outline-none focus:border-amber-600"></textarea>
                </div>

                <div class="flex justify-end gap-3">
                    <button type="button" onclick="closeModal()" class="px-4 py-2 bg-stone-800 hover:bg-stone-700 rounded-lg text-sm text-stone-300">Cancelar</button>
                    <button type="submit" class="px-4 py-2 bg-amber-700 hover:bg-amber-600 rounded-lg text-sm font-medium text-white">Guardar</button>
                </div>
            </form>
        </div>
    </div>

    <!-- JavaScript Logic -->
    <script>
        const SUPABASE_URL = 'https://akyewbyhbgcvlcblkerb.supabase.co';
        const SUPABASE_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImFreWV3YnloYmdjdmxjYmxrZXJiIiwicm9sZSI6ImFub24iLCJpYXQiOjE3OTAyMzczNTYsImV4cCI6MjEwNTgxMzM1Nn0.J3eunUN-qE99cgocSSNO93oNH9nZbSP-C-dJYSyPdlA';
        const TMDB_API_KEY = '592f0a9b86580dc2aae33e086a9116cb';

        const supabaseClient = supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

        let items = [];
        let currentCategoryFilter = 'all';

        document.addEventListener('DOMContentLoaded', () => {
            fetchItems();
        });

        async function fetchItems() {
            try {
                const { data, error } = await supabaseClient
                    .from('media_items')
                    .select('*')
                    .order('created_at', { ascending: false });

                if (error) throw error;
                items = data || [];
                renderItems();
            } catch (err) {
                console.error('Error al cargar datos:', err.message);
            }
        }

        function renderItems() {
            const bookshelf = document.getElementById('bookshelfContainer');
            const emptyState = document.getElementById('emptyState');
            const statusFilter = document.getElementById('statusSelect').value;

            bookshelf.innerHTML = '';

            const filtered = items.filter(item => {
                let catMatch = false;
                if (currentCategoryFilter === 'all') catMatch = true;
                else if (currentCategoryFilter === 'library') catMatch = item.in_library === true;
                else if (currentCategoryFilter === 'pending_watch') catMatch = (item.category === 'movie' || item.category === 'tv') && item.status === 'planned';
                else if (currentCategoryFilter === 'shopping_list') catMatch = item.to_buy === true;
                else catMatch = item.category === currentCategoryFilter;

                const statusMatch = statusFilter === 'all' || item.status === statusFilter;
                return catMatch && statusMatch;
            });

            if (filtered.length === 0) {
                emptyState.classList.remove('hidden');
                return;
            }

            emptyState.classList.add('hidden');

            const ITEMS_PER_SHELF = 6;
            for (let i = 0; i < filtered.length; i += ITEMS_PER_SHELF) {
                const shelfItems = filtered.slice(i, i + ITEMS_PER_SHELF);
                const shelfDiv = document.createElement('div');
                shelfDiv.className = 'relative flex flex-col';

                const gridDiv = document.createElement('div');
                gridDiv.className = 'grid grid-cols-2 sm:grid-cols-3 md:grid-cols-6 gap-6 px-4 items-end pb-1';

                shelfItems.forEach(item => {
                    gridDiv.appendChild(createShelfCase(item));
                });

                const woodShelfBar = document.createElement('div');
                woodShelfBar.className = 'delicious-shelf h-6 w-full rounded-sm shadow-2xl mt-1';

                shelfDiv.appendChild(gridDiv);
                shelfDiv.appendChild(woodShelfBar);
                bookshelf.appendChild(shelfDiv);
            }
        }

        function createShelfCase(item) {
            const wrapper = document.createElement('div');
            wrapper.className = 'flex flex-col items-center group cursor-pointer';
            wrapper.onclick = () => openDetailModal(item.id);

            wrapper.innerHTML = `
                <div class="relative rounded-sm overflow-hidden case-3d-shadow border border-white/20 bg-black aspect-[2/3] w-full">
                    <img src="${item.cover_url}" alt="${item.title}" class="w-full h-full object-cover" onerror="this.src='https://via.placeholder.com/300x450/1e293b/94a3b8?text=Sin+Imagen'">
                    
                    ${item.rating > 0 ? `
                        <div class="absolute bottom-1 right-1 bg-black/80 text-amber-400 text-[10px] font-bold px-1.5 py-0.5 rounded flex items-center gap-0.5 shadow">
                            <i class="fa-solid fa-star text-[9px]"></i> ${item.rating}
                        </div>
                    ` : ''}
                </div>

                <div class="mt-1 bg-black/80 text-amber-100 text-[11px] font-bold px-2 py-0.5 rounded border border-amber-900/80 truncate max-w-full text-center shadow">
                    ${item.title}
                </div>
            `;
            return wrapper;
        }

        function openDetailModal(id) {
            const item = items.find(i => i.id == id);
            if (!item) return;

            const modalContent = document.getElementById('detailModalContent');
            
            let logosHTML = '';
            if (item.platform_logo) {
                const logos = item.platform_logo.split(',').filter(Boolean);
                logosHTML = `<div class="flex items-center gap-2 mt-2">
                    ${logos.map(url => `<img src="${url}" class="w-7 h-7 rounded-md object-cover border border-amber-900/40 shadow">`).join('')}
                </div>`;
            } else if (item.platform) {
                logosHTML = `<p class="text-xs text-amber-300 font-semibold mt-1"><i class="fa-solid fa-tv mr-1"></i> ${item.platform}</p>`;
            }

            modalContent.innerHTML = `
                <div class="w-full md:w-1/3 flex-shrink-0">
                    <img src="${item.cover_url}" class="w-full rounded-xl shadow-2xl border border-amber-900/40 object-cover aspect-[2/3]">
                    ${item.format ? `<div class="mt-3 text-center bg-amber-900/50 text-amber-200 border border-amber-700/50 text-xs font-bold py-1 px-3 rounded-lg shadow"><i class="fa-solid fa-compact-disc mr-1"></i> Formato: ${item.format}</div>` : ''}
                    
                    <button onclick="reloadTMDBData('${item.id}', '${item.title.replace(/'/g, "\\'")}')" id="reloadBtn-${item.id}" class="w-full mt-3 bg-amber-800 hover:bg-amber-700 text-amber-100 text-xs font-semibold py-2 px-3 rounded-lg border border-amber-600/40 transition flex items-center justify-center gap-2 shadow">
                        <i class="fa-solid fa-rotate mr-1"></i> Recargar Ficha (TMDB/IMDb)
                    </button>
                </div>

                <div class="w-full md:w-2/3 flex flex-col justify-between">
                    <div>
                        <div class="flex items-start justify-between gap-2">
                            <h2 class="text-2xl font-bold text-amber-100">${item.title}</h2>
                            <div class="flex items-center gap-2">
                                <button onclick="editItem('${item.id}')" class="text-amber-400 hover:text-amber-300 p-1" title="Editar"><i class="fa-solid fa-pen"></i></button>
                                <button onclick="deleteItem('${item.id}')" class="text-rose-400 hover:text-rose-300 p-1" title="Eliminar"><i class="fa-solid fa-trash"></i></button>
                            </div>
                        </div>

                        ${item.subtitle ? `<p class="text-sm text-amber-400/80 mt-1 font-medium">${item.subtitle}</p>` : ''}

                        <div class="flex items-center gap-3 mt-3">
                            <span class="text-xs px-2.5 py-1 rounded-full bg-amber-950/80 text-amber-300 border border-amber-800/50 uppercase font-bold tracking-wider">${getCategoryName(item.category)}</span>
                            ${item.rating > 0 ? `<span class="text-xs font-bold text-amber-400 flex items-center gap-1"><i class="fa-solid fa-star"></i> ${item.rating} / 10</span>` : ''}
                        </div>

                        ${logosHTML ? `<div class="mt-4"><p class="text-xs font-semibold text-stone-400 uppercase">Disponible en:</p>${logosHTML}</div>` : ''}

                        <div class="mt-4 pt-4 border-t border-amber-900/30 space-y-3">
                            <div>
                                <h4 class="text-xs font-semibold text-stone-400 uppercase mb-1"><i class="fa-solid fa-align-left mr-1"></i> Sinopsis / Trama</h4>
                                <p class="text-sm text-stone-300 leading-relaxed max-h-48 overflow-y-auto pr-1">${item.review || 'Sin sinopsis disponible. Haz clic en "Recargar Ficha" para buscar la trama en TMDB.'}</p>
                            </div>
                        </div>
                    </div>

                    <div class="mt-6 flex items-center justify-between text-xs text-stone-400 pt-3 border-t border-amber-900/30">
                        <span>Estado: <strong class="text-amber-200 capitalize">${item.status}</strong></span>
                        ${item.in_library ? `<span class="text-emerald-400 font-semibold"><i class="fa-solid fa-check-circle mr-1"></i> En Biblioteca Física</span>` : ''}
                    </div>
                </div>
            `;

            document.getElementById('detailModal').classList.remove('hidden');
        }

        // Botón especial para recargar datos y sinopsis individualmente desde TMDB
        async function reloadTMDBData(id, title) {
            const btn = document.getElementById(`reloadBtn-${id}`);
            if (btn) btn.innerHTML = '<i class="fa-solid fa-spinner fa-spin mr-1"></i> Buscando...';

            try {
                const res = await fetch(`https://api.themoviedb.org/3/search/movie?api_key=${TMDB_API_KEY}&query=${encodeURIComponent(title)}&language=es-ES`);
                const data = await res.json();

                if (data.results && data.results.length > 0) {
                    const match = data.results[0];
                    let overview = match.overview || '';
                    let coverUrl = match.poster_path ? `https://image.tmdb.org/t/p/w500${match.poster_path}` : '';

                    // Fallback en inglés si no hay sinopsis traducida
                    if (!overview) {
                        const enRes = await fetch(`https://api.themoviedb.org/3/movie/${match.id}?api_key=${TMDB_API_KEY}&language=en-US`);
                        const enData = await enRes.json();
                        overview = enData.overview || '';
                    }

                    let castText = '';
                    try {
                        const credRes = await fetch(`https://api.themoviedb.org/3/movie/${match.id}/credits?api_key=${TMDB_API_KEY}&language=es-ES`);
                        const credData = await credRes.json();
                        if (credData.cast) castText = credData.cast.slice(0, 5).map(c => c.name).join(', ');
                    } catch (e) {}

                    const providerInfo = await fetchWatchProviders('movie', match.id);
                    const releaseYear = match.release_date ? match.release_date.split('-')[0] : '';
                    const subtitle = [releaseYear ? `Año: ${releaseYear}` : '', castText ? `Reparto: ${castText}` : ''].filter(Boolean).join(' | ');

                    const updatedFields = {
                        review: overview,
                        subtitle: subtitle,
                        platform: providerInfo.names,
                        platform_logo: providerInfo.logos
                    };
                    if (coverUrl) updatedFields.cover_url = coverUrl;

                    const { error } = await supabaseClient.from('media_items').update(updatedFields).eq('id', id);
                    if (error) throw error;

                    await fetchItems();
                    openDetailModal(id);
                    alert('¡Ficha y sinopsis actualizadas con éxito!');
                } else {
                    alert('No se encontraron datos en TMDB para este título.');
                }
            } catch (err) {
                alert('Error al recargar datos: ' + err.message);
            } finally {
                if (btn) btn.innerHTML = '<i class="fa-solid fa-rotate mr-1"></i> Recargar Ficha (TMDB/IMDb)';
            }
        }

        function closeDetailModal() {
            document.getElementById('detailModal').classList.add('hidden');
        }

        function toggleFormatSelector() {
            const inLibrary = document.getElementById('formInLibrary').checked;
            const formatContainer = document.getElementById('formatContainer');
            if (inLibrary) formatContainer.classList.remove('hidden');
            else formatContainer.classList.add('hidden');
        }

        function getCategoryName(cat) {
            const map = { movie: 'Película', tv: 'Serie', book: 'Libro', comic: 'Cómic', game: 'Juego', travel: 'Viaje' };
            return map[cat] || cat;
        }

        function setCategoryFilter(cat) {
            currentCategoryFilter = cat;
            document.querySelectorAll('.cat-btn').forEach(btn => {
                if (btn.dataset.cat === cat) {
                    btn.className = 'cat-btn bg-amber-700 text-white px-3 py-1.5 rounded-lg text-sm font-medium transition';
                } else {
                    btn.className = 'cat-btn text-amber-200/80 hover:text-white px-3 py-1.5 rounded-lg text-sm font-medium transition';
                }
            });
            renderItems();
        }

        // Importación CSV con captura garantizada de Sinopsis (ES + EN)
        async function importLetterboxdCSV(event) {
            const file = event.target.files[0];
            if (!file) return;

            const progressModal = document.getElementById('importProgressModal');
            const progressBar = document.getElementById('importProgressBar');
            const progressStatus = document.getElementById('importProgressStatus');

            const reader = new FileReader();
            reader.onload = async function(e) {
                const text = e.target.result;
                const lines = text.split('\n').map(l => l.trim()).filter(Boolean);
                if (lines.length <= 1) return alert('El archivo CSV está vacío');

                const delimiter = lines[0].includes(';') ? ';' : ',';
                const headers = lines[0].toLowerCase().split(delimiter).map(h => h.trim().replace(/^"(.*)"$/, '$1'));

                const nameIdx = headers.findIndex(h => h === 'name' || h === 'title' || h.includes('titulo') || h.includes('título'));
                const yearIdx = headers.findIndex(h => h === 'year' || h.includes('año'));
                const ratingIdx = headers.findIndex(h => h === 'rating' || h.includes('puntuacion'));

                if (nameIdx === -1) return alert('No se encontró la columna de Títulos.');

                progressModal.classList.remove('hidden');
                const totalMovies = lines.length - 1;
                const itemsToInsert = [];

                for (let i = 1; i <= totalMovies; i++) {
                    const cols = lines[i].split(delimiter).map(c => c.trim().replace(/^"(.*)"$/, '$1'));
                    const title = cols[nameIdx];
                    if (!title) continue;

                    const year = yearIdx !== -1 ? cols[yearIdx] : '';
                    let rawRating = ratingIdx !== -1 ? parseFloat(cols[ratingIdx]) : 0;
                    let rating = isNaN(rawRating) ? 0 : rawRating;
                    if (rating > 0 && rating <= 5) rating = rating * 2;

                    progressBar.style.width = Math.round((i / totalMovies) * 100) + '%';
                    progressStatus.textContent = `Procesando ${i} de ${totalMovies}: "${title}"`;

                    let coverUrl = '';
                    let overview = '';
                    let castText = '';
                    let platformNames = '';
                    let platformLogos = '';

                    try {
                        let queryUrl = `https://api.themoviedb.org/3/search/movie?api_key=${TMDB_API_KEY}&query=${encodeURIComponent(title)}&language=es-ES`;
                        if (year) queryUrl += `&year=${year}`;

                        let res = await fetch(queryUrl);
                        let tmdbData = await res.json();

                        if (tmdbData.results && tmdbData.results.length > 0) {
                            let match = tmdbData.results[0];

                            if (!match.overview) {
                                try {
                                    const enRes = await fetch(`https://api.themoviedb.org/3/movie/${match.id}?api_key=${TMDB_API_KEY}&language=en-US`);
                                    const enData = await enRes.json();
                                    overview = enData.overview || '';
                                } catch(e) {}
                            } else {
                                overview = match.overview;
                            }

                            if (match.poster_path) coverUrl = `https://image.tmdb.org/t/p/w500${match.poster_path}`;

                            try {
                                const credRes = await fetch(`https://api.themoviedb.org/3/movie/${match.id}/credits?api_key=${TMDB_API_KEY}&language=es-ES`);
                                const credData = await credRes.json();
                                if (credData.cast) {
                                    castText = credData.cast.slice(0, 5).map(c => c.name).join(', ');
                                }
                            } catch (e) {}

                            const providerInfo = await fetchWatchProviders('movie', match.id);
                            platformNames = providerInfo.names;
                            platformLogos = providerInfo.logos;
                        }
                    } catch (err) {
                        console.error('Error buscando película:', title, err);
                    }

                    if (!coverUrl) coverUrl = 'https://via.placeholder.com/300x450/1e293b/94a3b8?text=' + encodeURIComponent(title);

                    const subtitleFull = [year ? `Año: ${year}` : '', castText ? `Reparto: ${castText}` : ''].filter(Boolean).join(' | ');

                    itemsToInsert.push({
                        title: title,
                        subtitle: subtitleFull,
                        category: 'movie',
                        status: 'completed',
                        rating: rating,
                        cover_url: coverUrl,
                        platform: platformNames,
                        platform_logo: platformLogos,
                        review: overview,
                        in_library: false,
                        to_buy: false
                    });
                }

                if (itemsToInsert.length > 0) {
                    try {
                        const { error } = await supabaseClient.from('media_items').insert(itemsToInsert);
                        if (error) throw error;
                        setTimeout(() => {
                            progressModal.classList.add('hidden');
                            alert(`¡Éxito! Importadas ${itemsToInsert.length} películas con sus sinopsis y repartos.`);
                            fetchItems();
                        }, 500);
                    } catch (err) {
                        progressModal.classList.add('hidden');
                        alert('Error guardando en Supabase: ' + err.message);
                    }
                }
            };
            reader.readAsText(file);
        }

        // Modal Formulario
        function openModal() {
            document.getElementById('editingItemId').value = '';
            document.getElementById('modalTitle').textContent = 'Añadir Nuevo Elemento';
            document.getElementById('mediaForm').reset();
            document.getElementById('searchResults').classList.add('hidden');
            toggleFormatSelector();
            handleCategoryChange();
            document.getElementById('itemModal').classList.remove('hidden');
        }

        function closeModal() {
            document.getElementById('itemModal').classList.add('hidden');
        }

        function handleCategoryChange() {
            const cat = document.getElementById('formCategory').value;
            const subLabel = document.getElementById('subtitleLabel');
            const platformContainer = document.getElementById('platformContainer');
            if (cat === 'movie' || cat === 'tv') {
                subLabel.textContent = 'Director / Reparto / Año';
                platformContainer.classList.remove('hidden');
            } else {
                subLabel.textContent = 'Autor / Creador';
                platformContainer.classList.add('hidden');
            }
        }

        function editItem(id) {
            closeDetailModal();
            const item = items.find(i => i.id == id);
            if (!item) return;

            document.getElementById('editingItemId').value = item.id;
            document.getElementById('modalTitle').textContent = 'Editar Elemento';
            document.getElementById('formCategory').value = item.category || 'movie';
            handleCategoryChange();

            document.getElementById('formTitle').value = item.title || '';
            document.getElementById('formSubtitle').value = item.subtitle || '';
            document.getElementById('formPlatform').value = item.platform || '';
            document.getElementById('formPlatformLogo').value = item.platform_logo || '';
            document.getElementById('formCover').value = item.cover_url || '';
            document.getElementById('formStatus').value = item.status || 'planned';
            document.getElementById('formRating').value = item.rating || 0;
            document.getElementById('formInLibrary').checked = item.in_library || false;
            document.getElementById('formFormat').value = item.format || 'Blu-ray';
            document.getElementById('formToBuy').checked = item.to_buy || false;
            document.getElementById('formReview').value = item.review || '';

            toggleFormatSelector();
            document.getElementById('itemModal').classList.remove('hidden');
        }

        async function saveItem(e) {
            e.preventDefault();
            const id = document.getElementById('editingItemId').value;

            const itemData = {
                category: document.getElementById('formCategory').value,
                title: document.getElementById('formTitle').value,
                subtitle: document.getElementById('formSubtitle').value,
                platform: document.getElementById('formPlatform').value,
                platform_logo: document.getElementById('formPlatformLogo').value,
                cover_url: document.getElementById('formCover').value,
                status: document.getElementById('formStatus').value,
                rating: parseFloat(document.getElementById('formRating').value) || 0,
                in_library: document.getElementById('formInLibrary').checked,
                format: document.getElementById('formInLibrary').checked ? document.getElementById('formFormat').value : null,
                to_buy: document.getElementById('formToBuy').checked,
                review: document.getElementById('formReview').value
            };

            try {
                let error;
                if (id) {
                    const response = await supabaseClient.from('media_items').update(itemData).eq('id', id);
                    error = response.error;
                } else {
                    const response = await supabaseClient.from('media_items').insert([itemData]);
                    error = response.error;
                }

                if (error) throw error;
                closeModal();
                fetchItems();
            } catch (err) {
                alert('Error al guardar: ' + err.message);
            }
        }

        async function deleteItem(id) {
            if (!confirm('¿Seguro que quieres eliminar este elemento?')) return;
            try {
                closeDetailModal();
                const { error } = await supabaseClient.from('media_items').delete().eq('id', id);
                if (error) throw error;
                fetchItems();
            } catch (err) {
                alert('Error al eliminar: ' + err.message);
            }
        }

        async function fetchWatchProviders(type, tmdbId) {
            try {
                const res = await fetch(`https://api.themoviedb.org/3/${type}/${tmdbId}/watch/providers?api_key=${TMDB_API_KEY}`);
                const data = await res.json();
                if (data.results && data.results.ES && data.results.ES.flatrate) {
                    const providers = data.results.ES.flatrate;
                    const names = providers.slice(0, 3).map(p => p.provider_name).join(', ');
                    const logos = providers.slice(0, 3).map(p => `https://image.tmdb.org/t/p/w92${p.logo_path}`).join(',');
                    return { names, logos };
                }
            } catch (e) {
                console.error('Error plataformas:', e);
            }
            return { names: '', logos: '' };
        }

        async function autoSearchCover() {
            const title = document.getElementById('formTitle').value.trim();
            const cat = document.getElementById('formCategory').value;
            const searchBtn = document.getElementById('searchBtn');
            const resultsDiv = document.getElementById('searchResults');

            if (!title) return alert('Escribe primero el título');

            searchBtn.innerHTML = '<i class="fa-solid fa-spinner fa-spin"></i>';
            resultsDiv.innerHTML = '';
            resultsDiv.classList.add('hidden');

            try {
                if (cat === 'movie' || cat === 'tv') {
                    const type = cat === 'movie' ? 'movie' : 'tv';
                    const res = await fetch(`https://api.themoviedb.org/3/search/${type}?api_key=${TMDB_API_KEY}&query=${encodeURIComponent(title)}&language=es-ES`);
                    const data = await res.json();
                    
                    if (data.results && data.results.length > 0) {
                        resultsDiv.classList.remove('hidden');
                        for (const item of data.results.slice(0, 5)) {
                            const name = item.title || item.name;
                            const releaseDate = item.release_date || item.first_air_date || '';
                            const year = releaseDate ? releaseDate.split('-')[0] : 'N/A';
                            const poster = item.poster_path ? `https://image.tmdb.org/t/p/w92${item.poster_path}` : 'https://via.placeholder.com/92x138?text=No+Img';
                            const fullPoster = item.poster_path ? `https://image.tmdb.org/t/p/w500${item.poster_path}` : '';
                            
                            let overview = item.overview || '';
                            if (!overview) {
                                try {
                                    const enRes = await fetch(`https://api.themoviedb.org/3/${type}/${item.id}?api_key=${TMDB_API_KEY}&language=en-US`);
                                    const enData = await enRes.json();
                                    overview = enData.overview || '';
                                } catch(e) {}
                            }

                            let castText = '';
                            try {
                                const credRes = await fetch(`https://api.themoviedb.org/3/${type}/${item.id}/credits?api_key=${TMDB_API_KEY}&language=es-ES`);
                                const credData = await credRes.json();
                                if (credData.cast) castText = credData.cast.slice(0, 4).map(c => c.name).join(', ');
                            } catch (e) {}

                            const providerInfo = await fetchWatchProviders(type, item.id);

                            const row = document.createElement('div');
                            row.className = 'flex items-center justify-between p-2 hover:bg-stone-800 rounded-lg cursor-pointer transition gap-2';
                            row.onclick = () => {
                                const sub = [year ? `Año: ${year}` : '', castText ? `Reparto: ${castText}` : ''].filter(Boolean).join(' | ');
                                selectResult(name, sub, fullPoster, providerInfo.names, providerInfo.logos);
                                document.getElementById('formReview').value = overview;
                            };
                            
                            row.innerHTML = `
                                <div class="flex items-center gap-3 overflow-hidden">
                                    <img src="${poster}" class="w-10 h-14 object-cover rounded flex-shrink-0">
                                    <div class="overflow-hidden">
                                        <p class="text-sm font-semibold text-slate-200 truncate">${name}</p>
                                        <p class="text-xs text-slate-400">${year} ${castText ? `• ${castText}` : ''}</p>
                                    </div>
                                </div>
                            `;
                            resultsDiv.appendChild(row);
                        }
                    }
                }
            } catch (e) {
                console.error(e);
            } finally {
                searchBtn.innerHTML = '<i class="fa-solid fa-magnifying-glass"></i> <span>Buscar</span>';
            }
        }

        function selectResult(title, subtitle, coverUrl, platform, platformLogo) {
            document.getElementById('formTitle').value = title;
            document.getElementById('formSubtitle').value = subtitle;
            if (coverUrl) document.getElementById('formCover').value = coverUrl;
            if (platform) document.getElementById('formPlatform').value = platform;
            if (platformLogo) document.getElementById('formPlatformLogo').value = platformLogo;
            document.getElementById('searchResults').classList.add('hidden');
        }
    </script>
