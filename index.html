<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Media Tracker</title>
  <style>
    :root {
      --bg-color: #0f0f0f;
      --card-bg: #181818;
      --modal-bg: #1f1f1f;
      --accent-color: #d4a373;
      --accent-hover: #faedcd;
      --input-bg: #2b2b2b;
      --text-color: #e0e0e0;
      --text-muted: #aaaaaa;
      --border-color: #3f3f3f;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      background-color: var(--bg-color);
      color: var(--text-color);
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      padding: 20px;
    }

    .modal-container {
      width: 100%;
      max-width: 520px;
      background-color: var(--modal-bg);
      border-radius: 12px;
      padding: 24px;
      box-shadow: 0 8px 32px rgba(0, 0, 0, 0.7);
      border: 1px solid #2a2a2a;
      position: relative;
    }

    .modal-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 20px;
    }

    .modal-header h2 {
      font-size: 1.25rem;
      color: #ffffff;
      font-weight: 600;
    }

    .close-btn {
      background: none;
      border: none;
      color: var(--text-muted);
      font-size: 1.4rem;
      cursor: pointer;
      line-height: 1;
    }

    .close-btn:hover {
      color: #ffffff;
    }

    .form-group {
      margin-bottom: 16px;
      display: flex;
      flex-direction: column;
    }

    label {
      font-size: 0.75rem;
      font-weight: 700;
      letter-spacing: 0.05em;
      margin-bottom: 6px;
      color: var(--accent-color);
      text-transform: uppercase;
    }

    input[type="text"],
    input[type="number"],
    input[type="url"],
    select,
    textarea {
      background-color: var(--input-bg);
      border: 1px solid var(--border-color);
      border-radius: 6px;
      color: #ffffff;
      padding: 10px 12px;
      font-size: 0.9rem;
      outline: none;
      width: 100%;
      transition: border-color 0.2s;
    }

    input:focus, select:focus, textarea:focus {
      border-color: var(--accent-color);
    }

    .search-row {
      display: flex;
      gap: 8px;
    }

    .btn-search {
      background-color: #3a2e1e;
      border: 1px solid var(--accent-color);
      border-radius: 6px;
      color: var(--accent-color);
      cursor: pointer;
      width: 42px;
      height: 42px;
      display: flex;
      align-items: center;
      justify-content: center;
      flex-shrink: 0;
      transition: background-color 0.2s;
    }

    .btn-search:hover {
      background-color: #4a3b27;
    }

    .row-two-col {
      display: flex;
      gap: 12px;
    }

    .row-two-col .form-group {
      flex: 1;
    }

    .checkbox-group {
      flex-direction: row;
      align-items: center;
      gap: 10px;
      margin-top: 8px;
      margin-bottom: 12px;
      background-color: rgba(255, 255, 255, 0.02);
      padding: 10px;
      border-radius: 6px;
      border: 1px solid #2a2a2a;
    }

    .checkbox-group input[type="checkbox"] {
      width: 16px;
      height: 16px;
      accent-color: var(--accent-color);
      cursor: pointer;
    }

    .checkbox-group label {
      text-transform: none;
      font-weight: normal;
      cursor: pointer;
      margin-bottom: 0;
      color: var(--text-color);
      font-size: 0.85rem;
    }

    .form-actions {
      display: flex;
      justify-content: flex-end;
      gap: 10px;
      margin-top: 20px;
    }

    .btn {
      padding: 10px 20px;
      border-radius: 6px;
      font-size: 0.9rem;
      font-weight: 500;
      cursor: pointer;
      border: none;
    }

    .btn-secondary {
      background-color: #2b2b2b;
      color: var(--text-color);
    }

    .btn-secondary:hover {
      background-color: #383838;
    }

    .btn-primary {
      background-color: #8c4303;
      color: #ffffff;
    }

    .btn-primary:hover {
      background-color: #a65004;
    }

    .spinner {
      width: 16px;
      height: 16px;
      border: 2px solid rgba(212, 163, 115, 0.3);
      border-top: 2px solid var(--accent-color);
      border-radius: 50%;
      animation: spin 0.8s linear infinite;
      display: none;
    }

    @keyframes spin {
      0% { transform: rotate(0deg); }
      100% { transform: rotate(360deg); }
    }
  </style>
</head>
<body>

  <div class="modal-container">
    <div class="modal-header">
      <h2>Añadir Nuevo Elemento</h2>
      <button type="button" class="close-btn">&times;</button>
    </div>

    <form id="tracker-form">
      <!-- Categoria -->
      <div class="form-group">
        <label for="tipo">CATEGORÍA</label>
        <select id="tipo">
          <option value="Videojuego" selected>Videojuego</option>
          <option value="Pelicula">Película / Serie</option>
          <option value="Libro">Libro</option>
          <option value="Comic">Cómic / Manga</option>
        </select>
      </div>

      <!-- Titulo con Busqueda -->
      <div class="form-group">
        <label for="titulo">TÍTULO</label>
        <div class="search-row">
          <input type="text" id="titulo" placeholder="Ej: Monkey Island" required>
          <button type="button" id="btn-buscar" class="btn-search" title="Buscar información">
            <span id="search-icon">⚙️️</span>
            <div id="spinner" class="spinner"></div>
          </button>
        </div>
      </div>

      <!-- Detalles -->
      <div class="form-group">
        <label for="detalles">DESARROLLADOR / AÑO / PLATAFORMA</label>
        <input type="text" id="detalles" placeholder="Detalles...">
      </div>

      <!-- Plataformas -->
      <div class="form-group">
        <label for="plataformas">PLATAFORMAS (PC, PS5, SWITCH...)</label>
        <input type="text" id="plataformas" placeholder="Ej: Devir, Edge, Netflix, Steam...">
      </div>

      <!-- URL de Portada -->
      <div class="form-group">
        <label for="portada">URL DE LA PORTADA / IMAGEN</label>
        <input type="url" id="portada" placeholder="https://...">
      </div>

      <!-- Estado y Puntuacion -->
      <div class="row-two-col">
        <div class="form-group">
          <label for="estado">ESTADO</label>
          <select id="estado">
            <option value="Pendiente">Pendiente</option>
            <option value="Jugando">Jugando / En proceso</option>
            <option value="Completado">Completado</option>
            <option value="Abandonado">Abandonado</option>
          </select>
        </div>

        <div class="form-group">
          <label for="puntuacion">PUNTUACIÓN (0 - 10)</label>
          <input type="number" id="puntuacion" min="0" max="10" value="0">
        </div>
      </div>

      <!-- Checkboxes -->
      <div class="form-group checkbox-group">
        <input type="checkbox" id="propiedad-fisica">
        <label for="propiedad-fisica">🏠 Añadir a Mi Biblioteca (Propiedad física)</label>
      </div>

      <div class="form-group checkbox-group">
        <input type="checkbox" id="deseo-compra">
        <label for="deseo-compra">🛒 Añadir a Lista de la Compra (Deseo comprarlo)</label>
      </div>

      <!-- Sinopsis -->
      <div class="form-group">
        <label for="sinopsis">SINOPSIS / RESEÑA</label>
        <textarea id="sinopsis" rows="3" placeholder="Detalles o descripción..."></textarea>
      </div>

      <!-- Botones de accion -->
      <div class="form-actions">
        <button type="button" class="btn btn-secondary">Cancelar</button>
        <button type="submit" class="btn btn-primary">Guardar</button>
      </div>
    </form>
  </div>

  <script>
    // Configuración opcional: Si tienes API Key de RAWG, colócala aquí. 
    // Si la dejas vacía, el sistema usará Wikipedia como servidor primario y libre de errores.
    const RAWG_API_KEY = ""; 

    const btnBuscar = document.getElementById('btn-buscar');
    const searchIcon = document.getElementById('search-icon');
    const spinner = document.getElementById('spinner');

    btnBuscar.addEventListener('click', async () => {
      const tipo = document.getElementById('tipo').value;
      const query = document.getElementById('titulo').value.trim();

      if (!query) {
        alert('Por favor, introduce un título para buscar.');
        return;
      }

      setLoading(true);

      try {
        if (tipo === 'Videojuego') {
          await buscarVideojuego(query);
        } else {
          await buscarEnWikipedia(query);
        }
      } catch (error) {
        console.error("Error durante la búsqueda:", error);
        alert(`Ocurrió un fallo al consultar los datos de "${query}".`);
      } finally {
        setLoading(false);
      }
    });

    async function buscarVideojuego(query) {
      if (RAWG_API_KEY && RAWG_API_KEY !== "") {
        // Método RAWG (Con API Key)
        try {
          const url = `https://api.rawg.io/api/games?key=${RAWG_API_KEY}&search=${encodeURIComponent(query)}&page_size=1`;
          const response = await fetch(url);
          if (!response.ok) throw new Error("Error RAWG HTTP: " + response.status);
          
          const data = await response.json();

          if (data.results && data.results.length > 0) {
            const juego = data.results[0];
            if (juego.background_image) {
              document.getElementById('portada').value = juego.background_image;
            }
            const ano = juego.released ? juego.released.split('-')[0] : '';
            const plataformas = juego.platforms ? juego.platforms.map(p => p.platform.name).join(', ') : '';
            document.getElementById('detalles').value = [ano, plataformas].filter(Boolean).join(' | ');
            document.getElementById('plataformas').value = plataformas;
            return;
          }
        } catch (err) {
          console.warn("Fallo RAWG API, recurriendo a búsqueda en Wikipedia...", err);
        }
      }

      // Método Libre (Wikipedia API - Sin API Key)
      await buscarEnWikipedia(query);
    }

    async function buscarEnWikipedia(query) {
      // Petición a Wikipedia en español
      const urlWiki = `https://es.wikipedia.org/w/api.php?action=query&titles=${encodeURIComponent(query)}&prop=pageimages|extracts&exintro=1&explaintext=1&pithumbsize=600&format=json&origin=*`;

      const response = await fetch(urlWiki);
      const data = await response.json();
      
      const pages = data.query.pages;
      const pageId = Object.keys(pages)[0];

      if (pageId !== "-1") {
        const page = pages[pageId];

        // Rellenar portada si existe
        if (page.thumbnail && page.thumbnail.source) {
          document.getElementById('portada').value = page.thumbnail.source;
        }

        // Rellenar sinopsis si existe
        if (page.extract) {
          document.getElementById('sinopsis').value = page.extract.substring(0, 300) + "...";
        }

        if (!page.thumbnail) {
          alert(`Se encontró el artículo para "${query}", pero no tiene una imagen de portada disponible.`);
        }
      } else {
        alert(`No se encontraron resultados para "${query}". Rellena la portada manualmente pegando la URL de la imagen.`);
      }
    }

    function setLoading(isLoading) {
      btnBuscar.disabled = isLoading;
      if (isLoading) {
        searchIcon.style.display = 'none';
        spinner.style.display = 'block';
      } else {
        searchIcon.style.display = 'inline';
        spinner.style.display = 'none';
      }
    }

    // Prevención de submit por defecto al presionar Enter en el formulario
    document.getElementById('tracker-form').addEventListener('submit', (e) => {
      e.preventDefault();
      alert('Elemento guardado correctamente.');
    });
  </script>
</body>
</html>
