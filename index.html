.delicious-wall::before {
    content:"";
    position:fixed;
    inset:0;
    pointer-events:none;
    z-index:0;
    background:
        linear-gradient(90deg, rgba(48,20,6,.20), transparent 10%, transparent 90%, rgba(44,18,5,.20)),
        linear-gradient(180deg, rgba(255,240,214,.06), transparent 22%, transparent 84%, rgba(38,13,3,.13));
}

.delicious-wall::after {
    content:"";
    position:fixed;
    inset:0;
    pointer-events:none;
    z-index:0;
    opacity:.20;
    background:repeating-linear-gradient(90deg, transparent 0 8px, rgba(47,19,5,.13) 8px 9px, transparent 9px 48px);
    mix-blend-mode:multiply;
}

#bookshelfContainer {
    position:relative;
    z-index:1;
    gap:28px !important;
}

/* Una unidad = hueco de madera + objetos + tablero delantero. */
.shelf-unit {
    position:relative;
    isolation:isolate;
    width:100%;
    margin:0 !important;
    padding:0 !important;
    filter:drop-shadow(0 9px 11px rgba(35,13,3,.16));
}

.shelf-unit::before {
    content:"";
    position:absolute;
    left:0;
    right:0;
    top:0;
    bottom:var(--shelf-height);
    z-index:-2;

.shelf-row {
    position:relative;
    display:grid;
    grid-template-columns:repeat(7, minmax(0,1fr));
    align-items:end;
    justify-items:center;
    gap:clamp(10px, 1.45vw, 22px);
    min-height:190px;
    height:190px;
    padding:12px clamp(18px, 2.3vw, 34px) 7px;
    overflow:visible;
    perspective:1500px;
}

.shelf-row::before {
    content:"";
    position:absolute;
    left:0;
    right:0;
    bottom:0;
    height:44px;
    z-index:-1;
    pointer-events:none;
    background:linear-gradient(180deg, rgba(255,230,195,.02), rgba(90,34,9,.05) 66%, rgba(48,16,3,.13));
}

.shelf-row::after {
    content:"";
    position:absolute;
    left:0;
    right:0;
    top:0;
    height:1px;
    background:rgba(255,230,196,.12);
    pointer-events:none;
}

    height:var(--shelf-height) !important;
    margin:0 !important;
    border:0 !important;
    border-radius:2px 2px 5px 5px;

    left:0;
    right:0;
    top:-2px;

    box-shadow:0 -1px 2px rgba(255,235,201,.30), 0 2px 2px rgba(69,22,4,.26);
}

.delicious-shelf::after {
    content:"";
    position:absolute;
    left:0;
    right:0;
    bottom:-3px;
    height:5px;
    border-radius:0 0 4px 4px;
    background:linear-gradient(180deg, rgba(82,31,8,.12), rgba(43,13,2,.35));
    pointer-events:none;
}

/* El espacio de cada objeto siempre termina exactamente en la balda. */
.case-perspective-container {
    position:relative;
    min-width:0;
    height:174px;
    display:flex;
    align-items:flex-end;
    justify-content:center;
    overflow:visible;
    cursor:pointer;
    transform-style:preserve-3d;
}

/* Pieza física. Nada de giros aleatorios: la colección debe quedar recta. */
.media-object {
    --media-w:96px;
    --media-h:158px;
    --depth:5px;
    --radius:2px;
    position:relative;
    width:var(--media-w);
    height:var(--media-h);
    flex:0 0 auto;
    transform-style:preserve-3d;
    transform:translateZ(0);
    transition:transform .26s cubic-bezier(.18,.72,.22,1), filter .26s ease;
    filter:drop-shadow(5px 7px 5px rgba(31,10,2,.34));
    will-change:transform;
    overflow:visible !important;
    z-index:2;
}

.media-front {
    position:absolute;
    inset:0;
    z-index:4;
    overflow:hidden;
    border-radius:var(--radius);
    background:#20160f;
    border:1px solid rgba(22,10,3,.40);
    box-shadow:
        0 0 0 1px rgba(255,236,204,.12),
        inset 0 0 0 1px rgba(0,0,0,.24),
        inset 0 0 13px rgba(0,0,0,.18);
    backface-visibility:hidden;
}

.media-front img {
    display:block;
    width:100%;
    height:100%;
    object-fit:cover;
    object-position:center;
}

/* Cara lateral física: una franja estrecha que aporta volumen sin deformar la portada. */
.media-side {
    position:absolute;
    z-index:2;
    top:2px;
    bottom:1px;
    right:calc(var(--depth) * -1);
    width:var(--depth);
    border-radius:0 2px 2px 0;
    background:linear-gradient(90deg, var(--side-light,#6c431f), var(--side-dark,#261105));
    box-shadow:2px 3px 4px rgba(25,7,1,.26);
}

/* Canto superior: mínimo y limpio, como en una caja real. */
.media-top {
    position:absolute;
    z-index:1;
    left:1px;
    right:calc(var(--depth) * -0.9);
    top:calc(var(--depth) * -0.65);
    height:calc(var(--depth) * .65);
    border-radius:2px 2px 0 0;
    background:linear-gradient(180deg, rgba(247,226,195,.42), rgba(94,52,23,.22));
}

/* Reflejo de plástico muy contenido. */
.media-object::before {
    content:"";
    position:absolute;

    z-index:7;

    mix-blend-mode:screen;
    opacity:.42;
}

/* Sombra de contacto: pegada a la balda, no flotando debajo. */

    content:"";
    position:absolute;
    z-index:-4;
    left:8%;
    right:-8%;
    bottom:-4px;
    height:8px;
    border-radius:50%;
    background:rgba(31,9,1,.58);
    filter:blur(5px);
}

    transform:translateY(-6px) translateZ(8px) scale(1.018);

    z-index:30;
}

    <script>
        const SUPABASE_URL = 'https://akyewbyhbgcvlcblkerb.supabase.co';
        const SUPABASE_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImFreWV3YnloYmdjdmxjYmxrZXJiIiwicm9sZSI6ImFub24iLCJpYXQiOjE3OTAyMzczNTYsImV4cCI6MjEwNTgxMzM1Nn0.J3eunUN-qE99cgocSSNO93oNH9nZbSP-C-dJYSyPdlA';
        const TMDB_API_KEY = 'bfeebc72cb63d4a06f85a63290e5206f';

        const supabaseClient = supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

        let items = [];
        let currentCategoryFilter = 'all';
        let searchQuery = '';
        let currentPage = 1;
        const ITEMS_PER_PAGE = 18;

        document.addEventListener('DOMContentLoaded', () => { fetchItems(); });

        async function fetchItems() {
            try {
                const { data, error } = await supabaseClient.from('media_items').select('*').order('created_at', { ascending: false });
                if (error) throw error;
                items = data || [];
                renderItems();
            } catch (err) { console.error('Error:', err.message); }
        }

        function handleCategoryChange() {
            const cat = document.getElementById('formCategory').value;
            const subLabel = document.getElementById('subtitleLabel');
            const platformContainer = document.getElementById('platformContainer');
            if (cat === 'movie' || cat === 'tv') {
                subLabel.textContent = 'Director / Reparto / Año';
                platformContainer.classList.remove('hidden');
            } else {
                subLabel.textContent = 'Autor / Año / Desarrollador';
                platformContainer.classList.add('hidden');
            }
        }

        function toggleFormatSelector() {
            const inLibrary = document.getElementById('formInLibrary').checked;
            const formatContainer = document.getElementById('formatContainer');
            if (inLibrary) formatContainer.classList.remove('hidden');
            else formatContainer.classList.add('hidden');
        }

        async function fetchWatchProviders(type, tmdbId) {
            try {
                const res = await fetch(`https://api.themoviedb.org/3/${type}/${tmdbId}/watch/providers?api_key=${TMDB_API_KEY}`);
                const data = await res.json();
                if (data.results && data.results.ES && data.results.ES.flatrate) {
                    const providers = data.results.ES.flatrate;
                    const names = providers.slice(0, 3).map(p => p.provider_name).join(', ');
                    const logos = providers.slice(0, 3).map(p => `https://image.tmdb.org/t/p/w92${p.logo_path}`).join(',');
                    return { names, logos };
                }
            } catch (e) { console.error('Error plataformas:', e); }
            return { names: '', logos: '' };
        }

        async function autoSearchCover() {
            const title = document.getElementById('formTitle').value.trim();
            const cat = document.getElementById('formCategory').value;
            const searchBtn = document.getElementById('searchBtn');
            const resultsDiv = document.getElementById('searchResults');

            if (!title) return alert('Escribe un título primero.');

            searchBtn.innerHTML = '<i class="fa-solid fa-spinner fa-spin"></i>';
            resultsDiv.innerHTML = '';
            resultsDiv.classList.add('hidden');

            let foundResults = [];

            try {
                if (cat === 'movie' || cat === 'tv') {
                    const res = await fetch(`https://api.themoviedb.org/3/search/${cat}?api_key=${TMDB_API_KEY}&query=${encodeURIComponent(title)}&language=es-ES`);
                    const data = await res.json();
                    if (data.results) {
                        for (const item of data.results.slice(0, 5)) {
                            const providerInfo = await fetchWatchProviders(cat, item.id);
                            foundResults.push({
                                name: item.title || item.name,
                                sub: item.release_date ? `Año: ${item.release_date.split('-')[0]}` : 'N/A',
                                cover: item.poster_path ? `https://image.tmdb.org/t/p/w500${item.poster_path}` : '',
                                desc: item.overview || '',
                                platform: providerInfo.names,
                                platformLogo: providerInfo.logos
                            });
                        }
                    }
                } else if (cat === 'book' || cat === 'comic') {
                    const res = await fetch(`https://www.googleapis.com/books/v1/volumes?q=${encodeURIComponent(title)}&maxResults=5`);
                    const data = await res.json();
                    if (data.items) {
                        foundResults = data.items.map(book => {
                            const info = book.volumeInfo || {};
                            let coverUrl = info.imageLinks ? (info.imageLinks.thumbnail || info.imageLinks.smallThumbnail || '') : '';
                            return {
                                name: info.title || title,
                                sub: info.authors ? `Autor: ${info.authors.join(', ')}` : 'Autor no indicado',
                                cover: coverUrl.replace('http:', 'https:'),
                                desc: info.description || '',
                                platform: '', platformLogo: ''
                            };
                        });
                    }
                } else if (cat === 'game') {
                    const res = await fetch(`https://api.rawg.io/api/games?key=6f10c69d80d24ee18055ee8db0f19a0d&search=${encodeURIComponent(title)}&page_size=5`);
                    const data = await res.json();
                    if (data.results) {
                        foundResults = data.results.map(g => ({
                            name: g.name,
                            sub: g.released ? `Año: ${g.released.split('-')[0]}` : 'Juego',
                            cover: g.background_image || '',
                            desc: '',
                            platform: '', platformLogo: ''
                        }));
                    }
                }

                if (foundResults.length > 0) {
                    resultsDiv.classList.remove('hidden');
                    foundResults.forEach(item => {
                        const row = document.createElement('div');
                        row.className = 'flex items-center gap-3 p-2 hover:bg-stone-800 rounded cursor-pointer transition';
                        row.onclick = () => selectResult(item.name, item.sub, item.cover, item.desc, item.platform, item.platformLogo);
                        
                        const coverImg = item.cover || `https://via.placeholder.com/92x138/1e293b/ffffff?text=${encodeURIComponent(item.name)}`;
                        
                        row.innerHTML = `
                            <img src="${coverImg}" class="w-10 h-14 object-cover rounded">
                            <div class="overflow-hidden">
                                <p class="text-sm font-semibold text-amber-100 truncate">${item.name}</p>
                                <p class="text-xs text-amber-400/80">${item.sub}</p>
                            </div>
                        `;
                        resultsDiv.appendChild(row);
                    });
                } else {
                    alert(`No se encontraron resultados para "${title}". Introduce la carátula manualmente.`);
                }
            } catch (err) {
                alert('Error al conectar con la API de búsqueda.');
            } finally {
                searchBtn.innerHTML = '<i class="fa-solid fa-magnifying-glass"></i> <span>Buscar</span>';
            }
        }

        function selectResult(title, subtitle, coverUrl, overview, platform = '', platformLogo = '') {
            document.getElementById('formTitle').value = title;
            document.getElementById('formSubtitle').value = subtitle;
            if (coverUrl) document.getElementById('formCover').value = coverUrl;
            if (overview) document.getElementById('formReview').value = overview;
            if (platform) document.getElementById('formPlatform').value = platform;
            if (platformLogo) document.getElementById('formPlatformLogo').value = platformLogo;
            document.getElementById('searchResults').classList.add('hidden');
        }

        function renderItems() {
            const container = document.getElementById('bookshelfContainer');
            container.innerHTML = '';
            const statusFilter = document.getElementById('statusSelect').value;

            const filtered = items.filter(item => {
                let catMatch = false;
                const isPending = (item.status === 'planned');

                if (currentCategoryFilter === 'pending_watch') {
                    catMatch = isPending;
                } else {
                    if (isPending) return false;

                    if (currentCategoryFilter === 'all') catMatch = true;
                    else if (currentCategoryFilter === 'library') catMatch = item.in_library === true;
                    else if (currentCategoryFilter === 'shopping_list') catMatch = item.to_buy === true;
                    else catMatch = item.category === currentCategoryFilter;
                }

                const statusMatch = statusFilter === 'all' || item.status === statusFilter;
                const searchMatch = !searchQuery || item.title.toLowerCase().includes(searchQuery) || (item.subtitle && item.subtitle.toLowerCase().includes(searchQuery));

                return catMatch && statusMatch && searchMatch;
            });

            if (filtered.length === 0) {
                document.getElementById('emptyState').classList.remove('hidden');
                document.getElementById('paginationControls').innerHTML = '';
                return;
            }
            document.getElementById('emptyState').classList.add('hidden');

            const totalPages = Math.ceil(filtered.length / ITEMS_PER_PAGE);
            if (currentPage > totalPages) currentPage = totalPages;
            if (currentPage < 1) currentPage = 1;

            const startIndex = (currentPage - 1) * ITEMS_PER_PAGE;
            const pageItems = filtered.slice(startIndex, startIndex + ITEMS_PER_PAGE);

            const SHELF_CAPACITY = 7;
            for (let i = 0; i < pageItems.length; i += SHELF_CAPACITY) {
                const shelfItems = pageItems.slice(i, i + SHELF_CAPACITY);
                const shelfDiv = document.createElement('div');
                shelfDiv.className = 'shelf-unit';

                const gridDiv = document.createElement('div');
                gridDiv.className = 'shelf-row';

                shelfItems.forEach(item => {
                    gridDiv.appendChild(createShelfCase(item));
                });

                const woodShelfBar = document.createElement('div');
                woodShelfBar.className = 'delicious-shelf h-6 w-full rounded-sm shadow-2xl mt-1';

                shelfDiv.appendChild(gridDiv);
                shelfDiv.appendChild(woodShelfBar);
                container.appendChild(shelfDiv);
            }

            renderPagination(totalPages, filtered.length);
        }

        function createShelfCase(item) {
            const wrapper = document.createElement('div');
            wrapper.className = 'case-perspective-container';
            wrapper.setAttribute('aria-label', item.title || 'Elemento');
            wrapper.title = item.title || '';
            wrapper.onclick = () => openDetailModal(item.id);

            const category = (item.category || '').toLowerCase();
            const format = (item.format || '').toLowerCase();
            let objectClass = 'media-poster';

            if (category === 'book') {
                objectClass = 'media-book';
            } else if (category === 'comic') {
                objectClass = 'media-comic';
            } else if (category === 'game') {
                objectClass = 'media-game';
            } else if (category === 'movie' || category === 'tv') {
                if (item.in_library) {
                    objectClass = 'media-case-movie';
                    if (format.includes('steelbook')) objectClass += ' media-case-steelbook';
                    else if (format.includes('4k')) objectClass += ' media-case-4k';
                    else if (format.includes('blu-ray')) objectClass += ' media-case-bluray';
                    else if (format.includes('dvd')) objectClass += ' media-case-dvd';
                } else {
                    objectClass = 'media-poster';
                }
            }

            const safeTitle = String(item.title || '').replace(/"/g, '&quot;');
            const cover = item.cover_url || `https://via.placeholder.com/300x450/8a552b/f2e1c8?text=${encodeURIComponent(item.title || 'Sin Imagen')}`;
            const ratingHTML = item.rating > 0
                ? `<div class="media-rating"><i class="fa-solid fa-star text-[7px]"></i> ${item.rating}</div>`
                : '';

            const object = document.createElement('div');
            object.className = `media-object ${objectClass}`;
            object.innerHTML = `
                <div class="media-top" aria-hidden="true"></div>
                <div class="media-side" aria-hidden="true"></div>
                <div class="media-front">
                    <img src="${cover}" alt="${safeTitle}" loading="lazy"
                        onerror="this.src='https://via.placeholder.com/300x450/8a552b/f2e1c8?text=Sin+Imagen'">
                </div>
                ${ratingHTML}
            `;

            wrapper.appendChild(object);
            return wrapper;
        }

        function openDetailModal(id) {
            const item = items.find(i => String(i.id) === String(id));
            if (!item) return;

            let logosHTML = '';
            if (item.platform_logo) {
                const logos = item.platform_logo.split(',').filter(Boolean);
                logosHTML = `<div class="flex items-center gap-2 mt-2">
                    ${logos.map(url => `<img src="${url}" class="w-7 h-7 rounded-md object-cover border border-amber-900/40 shadow">`).join('')}
                </div>`;
            } else if (item.platform) {
                logosHTML = `<p class="text-xs text-amber-300 font-semibold mt-1"><i class="fa-solid fa-tv mr-1"></i> ${item.platform}</p>`;
            }

            const modalContent = document.getElementById('detailModalContent');
            modalContent.innerHTML = `
                <div class="w-full md:w-1/3 flex-shrink-0">
                    <img src="${item.cover_url}" class="w-full rounded-xl shadow-2xl border border-amber-900/40 object-cover aspect-[2/3]">
                    ${item.format ? `<div class="mt-3 text-center bg-amber-900/50 text-amber-200 border border-amber-700/50 text-xs font-bold py-1 px-3 rounded-lg"><i class="fa-solid fa-compact-disc mr-1"></i> ${item.format}</div>` : ''}
                    <button onclick="reloadTMDBData('${item.id}', '${item.title.replace(/'/g, "\\'")}')" id="reloadBtn-${item.id}" class="w-full mt-3 bg-amber-800 hover:bg-amber-700 text-amber-100 text-xs font-semibold py-2 px-3 rounded-lg border border-amber-600/40 transition flex items-center justify-center gap-2 shadow">
                        <i class="fa-solid fa-rotate mr-1"></i> Recargar Ficha (TMDB)
                    </button>
                </div>
                <div class="w-full md:w-2/3 flex flex-col justify-between">
                    <div>
                        <div class="flex items-start justify-between gap-3 pr-10">
                            <h2 class="text-2xl font-bold text-amber-100">${item.title}</h2>
                            <div class="flex items-center gap-2.5 bg-stone-950/60 px-3 py-1.5 rounded-lg border border-amber-900/40 shadow-inner flex-shrink-0">
                                <button onclick="editItem('${item.id}')" class="text-amber-400 hover:text-amber-300 p-1.5 text-sm transition" title="Editar"><i class="fa-solid fa-pen"></i></button>
                                <span class="border-r border-amber-900/60 h-4"></span>
                                <button onclick="deleteItem('${item.id}')" class="text-rose-400 hover:text-rose-300 p-1.5 text-sm transition" title="Eliminar"><i class="fa-solid fa-trash"></i></button>
                            </div>
                        </div>
                        <p class="text-xs text-amber-300/90 font-medium mt-2">${item.subtitle || ''}</p>
                        ${logosHTML ? `<div class="mt-3"><p class="text-xs font-semibold text-stone-400 uppercase">Disponible en:</p>${logosHTML}</div>` : ''}
                        <div class="mt-4 pt-4 border-t border-amber-900/30">
                            <h4 class="text-xs font-semibold text-stone-400 uppercase mb-1"><i class="fa-solid fa-align-left mr-1"></i> Sinopsis / Trama</h4>
                            <p class="text-sm text-stone-300 leading-relaxed max-h-48 overflow-y-auto">${item.review || 'Sin sinopsis disponible.'}</p>
                        </div>
                    </div>
                    <div class="mt-6 flex items-center justify-between text-xs text-stone-400 pt-3 border-t border-amber-900/30">
                        <span>Estado: <strong class="text-amber-200 capitalize">${item.status}</strong></span>
                        ${item.in_library ? `<span class="text-emerald-400 font-semibold"><i class="fa-solid fa-check-circle mr-1"></i> En Biblioteca Física</span>` : ''}
                    </div>
                </div>
            `;
            document.getElementById('detailModal').classList.remove('hidden');
        }

        async function reloadTMDBData(id, title) {
            const strId = String(id);
            const btn = document.getElementById(`reloadBtn-${strId}`);
            if (btn) btn.innerHTML = '<i class="fa-solid fa-spinner fa-spin mr-1"></i> Buscando...';

            try {
                const res = await fetch(`https://api.themoviedb.org/3/search/movie?api_key=${TMDB_API_KEY}&query=${encodeURIComponent(title)}&language=es-ES`);
                const data = await res.json();

                if (data.results && data.results.length > 0) {
                    const match = data.results[0];
                    let overview = match.overview || '';
                    let coverUrl = match.poster_path ? `https://image.tmdb.org/t/p/w500${match.poster_path}` : '';
                    const providerInfo = await fetchWatchProviders('movie', match.id);

                    const updatedFields = {
                        review: overview,
                        platform: providerInfo.names,
                        platform_logo: providerInfo.logos
                    };
                    if (coverUrl) updatedFields.cover_url = coverUrl;

                    const { error } = await supabaseClient.from('media_items').update(updatedFields).eq('id', strId);
                    if (error) throw error;

                    await fetchItems();
                    openDetailModal(strId);
                    alert('¡Ficha e iconos de plataformas actualizados!');
                } else {
                    alert('No se encontraron datos en TMDB para este título.');
                }
            } catch (err) {
                alert('Error al recargar: ' + err.message);
            } finally {
                if (btn) btn.innerHTML = '<i class="fa-solid fa-rotate mr-1"></i> Recargar Ficha (TMDB)';
            }
        }

        function closeDetailModal() { document.getElementById('detailModal').classList.add('hidden'); }

        function renderPagination(totalPages, totalItems) {
            const container = document.getElementById('paginationControls');
            if (totalPages <= 1) {
                container.innerHTML = `<span class="text-xs text-amber-300 font-medium">Mostrando ${totalItems} elementos</span>`;
                return;
            }
            container.innerHTML = `
                <button onclick="changePage(${currentPage - 1})" ${currentPage === 1 ? 'disabled class="opacity-40 cursor-not-allowed text-xs text-amber-200 px-3 py-1 bg-stone-900 rounded-lg"' : 'class="text-xs text-amber-100 hover:text-white px-3 py-1 bg-stone-800 rounded-lg"'}>Anterior</button>
                <span class="text-xs text-amber-300 font-semibold px-2">Página ${currentPage} de ${totalPages}</span>
                <button onclick="changePage(${currentPage + 1})" ${currentPage === totalPages ? 'disabled class="opacity-40 cursor-not-allowed text-xs text-amber-200 px-3 py-1 bg-stone-900 rounded-lg"' : 'class="text-xs text-amber-100 hover:text-white px-3 py-1 bg-stone-800 rounded-lg"'}>Siguiente</button>
            `;
        }

        function changePage(page) {
            currentPage = page;
            renderItems();
            window.scrollTo({ top: 0, behavior: 'smooth' });
        }

        function setCategoryFilter(cat) {
            currentCategoryFilter = cat;
            currentPage = 1;
            renderItems();
        }

        function resetToHome() {
            currentCategoryFilter = 'all';
            searchQuery = '';
            currentPage = 1;
            document.getElementById('liveSearchInput').value = '';
            document.getElementById('statusSelect').value = 'all';
            renderItems();
        }

        function handleSearch() {
            searchQuery = document.getElementById('liveSearchInput').value.trim().toLowerCase();
            currentPage = 1;
            renderItems();
        }

        function openModal() {
            document.getElementById('editingItemId').value = '';
            document.getElementById('modalTitle').textContent = 'Añadir Nuevo Elemento';
            document.getElementById('mediaForm').reset();
            document.querySelectorAll('input[name="formatCheck"]').forEach(cb => cb.checked = false);
            document.getElementById('searchResults').classList.add('hidden');
            toggleFormatSelector();
            handleCategoryChange();
            document.getElementById('itemModal').classList.remove('hidden');
        }

        function closeModal() { document.getElementById('itemModal').classList.add('hidden'); }

        function editItem(id) {
            closeDetailModal();
            const item = items.find(i => String(i.id) === String(id));
            if (!item) return;

            document.getElementById('editingItemId').value = item.id;
            document.getElementById('modalTitle').textContent = 'Editar Elemento';
            document.getElementById('formCategory').value = item.category || 'movie';
            handleCategoryChange();

            document.getElementById('formTitle').value = item.title || '';
            document.getElementById('formSubtitle').value = item.subtitle || '';
            document.getElementById('formPlatform').value = item.platform || '';
            document.getElementById('formPlatformLogo').value = item.platform_logo || '';
            document.getElementById('formCover').value = item.cover_url || '';
            document.getElementById('formStatus').value = item.status || 'planned';
            document.getElementById('formRating').value = item.rating || 0;
            document.getElementById('formInLibrary').checked = item.in_library || false;
            document.getElementById('formToBuy').checked = item.to_buy || false;
            document.getElementById('formReview').value = item.review || '';

            const savedFormats = item.format ? item.format.split(',').map(f => f.trim()) : [];
            document.querySelectorAll('input[name="formatCheck"]').forEach(cb => {
                cb.checked = savedFormats.includes(cb.value);
            });

            toggleFormatSelector();
            document.getElementById('itemModal').classList.remove('hidden');
        }

        async function saveItem(e) {
            e.preventDefault();
            const id = document.getElementById('editingItemId').value;
            const selectedFormats = [];
            document.querySelectorAll('input[name="formatCheck"]:checked').forEach(cb => selectedFormats.push(cb.value));
            const inLibrary = document.getElementById('formInLibrary').checked;

            const itemData = {
                category: document.getElementById('formCategory').value,
                title: document.getElementById('formTitle').value,
                subtitle: document.getElementById('formSubtitle').value,
                platform: document.getElementById('formPlatform').value,
                platform_logo: document.getElementById('formPlatformLogo').value,
                cover_url: document.getElementById('formCover').value,
                status: document.getElementById('formStatus').value,
                rating: parseFloat(document.getElementById('formRating').value) || 0,
                in_library: inLibrary,
                format: inLibrary && selectedFormats.length > 0 ? selectedFormats.join(', ') : null,
                to_buy: document.getElementById('formToBuy').checked,
                review: document.getElementById('formReview').value
            };

            let error;
            if (id) {
                const res = await supabaseClient.from('media_items').update(itemData).eq('id', String(id));
                error = res.error;
            } else {
                const res = await supabaseClient.from('media_items').insert([itemData]);
                error = res.error;
            }

            if (error) alert('Error al guardar: ' + error.message);
            else { closeModal(); fetchItems(); }
        }

        async function deleteItem(id) {
            if (!confirm('¿Seguro que quieres eliminar este elemento?')) return;
            try {
                closeDetailModal();
                const { error } = await supabaseClient.from('media_items').delete().eq('id', String(id));
                if (error) throw error;
                fetchItems();
            } catch (err) {
                alert('Error al eliminar: ' + err.message);
            }
        }
    </script>
</body>
</html>
